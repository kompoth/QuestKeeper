[project]
name = "questkeeper-backend"
version = "0.1.0"
description = "Tabletop campaign knowledge base"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiomysql>=0.3.2",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.52.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "D",
    "EM101",
    "EM102",
    "TRY003",
    "RUF022",
    "COM812",
    "TD",
    "FIX",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "FBT", "S101", "S106", "PLR0913", "PLR2004", "ANN"]
"migrations/*" = ["INP001"]

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["Depends", "fastapi.Depends", "Query", "fastapi.Query"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
line_length = 120
multi_line_output = 3
split_on_trailing_comma = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ty>=0.0.102",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
