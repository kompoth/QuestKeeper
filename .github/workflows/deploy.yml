name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "**/Dockerfile"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust deploy host
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync backend/
        run: >
          rsync -az --delete
          backend/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/stacks/questkeeper/backend/

      - name: Sync frontend/
        run: >
          rsync -az --delete
          frontend/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/stacks/questkeeper/frontend/

      # The deploy-command.sh restricted key ignores whatever is sent and always runs the fixed
      # `docker compose build --pull && up -d` script server-side - this ssh call just triggers it.
      - name: Trigger deploy
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} true
